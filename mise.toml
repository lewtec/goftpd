[tools]
go = "1.27"
goreleaser = "2.17.0"
svu = "3.3.0"

[tasks.install]
description = "Download Go module deps"
run = "go mod download"

[tasks.generate]
description = "Run go generate (templ)"
run = "go generate ./..."

[tasks.fmt]
description = "Format Go packages"
run = "go fmt ./..."

[tasks.lint]
description = "Run go vet"
run = "go vet ./..."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.build]
description = "Build goftpd"
run = "go build -o goftpd ./cmd/goftpd"

[tasks.ci]
description = "Generate, format, vet, test, build"
depends = ["install", "generate", "fmt", "lint", "test", "build"]

[tasks.release]
description = "Tag and release with GoReleaser (svu + goreleaser)"
depends = ["ci"]
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = '''
git tag $(svu ${usage_version})
goreleaser release --clean
'''
